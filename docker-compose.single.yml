services:
  control:
    build:
      context: ./control
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:8000"
      - "8000:8000"
    env_file:
      - .env
    environment:
      - LATCH_DOMAIN=155.138.217.237
      - LATCH_PUBLIC_URL=http://155.138.217.237:8000
      - LATCH_WORKER_HOSTS=worker:7000
      - LATCH_DATA_DIR=/data
      - LATCH_DB_PATH=/data/latch.db
    volumes:
      - ./data:/data
      - ./control/latch/web/static:/app/latch/web/static:ro
    networks:
      - latch-internal
    depends_on:
      - worker

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7000:7000"
    env_file:
      - .env
    environment:
      - LATCH_BIND_IP=0.0.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - latch-internal

networks:
  latch-internal:
    driver: bridge
